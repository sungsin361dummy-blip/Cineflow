name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android Environment & Keys
        run: |
          touch .env
          touch .env.example
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5185479d0f797e44aab302b5708701509c25\n24333f8a63cbd824300774d6f7612373d49bc0e4" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a578e440d76b880404907da4760" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Build Android APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace -x test -x lint

      - name: Find & Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineFlow-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
